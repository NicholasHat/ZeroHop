name: tests

on:
  push:
  pull_request:

jobs:
  swift-test:
    # The unit tests need no GPU, ANE or models. A Swift 6.3 toolchain is
    # needed only because the pinned mlx-swift manifest declares it, and
    # SwiftPM resolves the whole graph even though the tests never build MLX.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift --version
      # Build only the test bundle (HarnessCore + SpeculationCore + tests);
      # a bare `swift test` would also compile MLX for the m3 runner.
      - run: swift build --product ZeroHopPackageTests
      - run: swift test --skip-build
